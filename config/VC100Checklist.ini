; VC100Checklist settings. Put this file next to VC100Checklist.asi (the game's "scripts" folder).
; Everything except [Window] is re-read each time you open the panel, so no restart is needed.

[Keys]
; Windows virtual-key codes, decimal. 116-119 = F5-F8, 33 = Page Up, 34 = Page Down
Toggle=118
PreviousCategory=116
NextCategory=117
MarkOnMap=119
ScrollUp=33
ScrollDown=34

[Display]
; Panel size in percent (100 = large). Position in percent of the screen from the top-left corner.
ScalePercent=50
LeftPercent=1
TopPercent=2

[Camera]
; EXPERIMENTAL, off by default. Only meant for free-camera mods that swing the camera behind Tommy when he
; fires: while a mouse button is held on foot, Tommy is turned to face where the camera looks.
AimTurnsPlayer=0

[Window]
; Only used when the ASI loader's borderless window mode is on (a wndmode.ini next to gta-vc.exe).
; While the game runs, the desktop is switched to this resolution so the borderless window fills the screen,
; and it is restored when the game closes or crashes. Use the same resolution as the game's own.
; 0 / 0 = leave the desktop alone.
DesktopWidth=0
DesktopHeight=0
; Does NOT work with the ASI loader's window mode (it re-centers the window); kept for other window-mode plugins.
FillScreen=0

[Flying]
; EXPERIMENTAL, off by default. Steers every aircraft the player flies with WASD alone: helicopters, the Skimmer,
; and the RC helicopters and RC plane. W forward, S backward, A / D turn; Space climbs, Left Shift descends;
; with nothing pressed it hovers. SpeedPercent scales how fast it flies.
SimpleControls=0
SpeedPercent=100
